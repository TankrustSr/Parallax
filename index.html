<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Parallax Art Visualizer v43 (LightBurn Fixed)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #controls {
            width: 340px;
            background: #2b2b36;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: #e5c59a; }
        h3 { margin-top: 10px; font-size: 1rem; color: #aaa; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px;}

        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #ccc; }
        input[type="range"], select {
            width: 100%;
            cursor: pointer;
            accent-color: #e5c59a;
        }
        
        .color-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .color-group label { margin-bottom: 2px; font-size: 0.8rem;}
        input[type="color"] {
            border: 1px solid #444;
            background: #1e1e24;
            width: 100%;
            height: 35px;
            cursor: pointer;
            border-radius: 4px;
        }

        .value-display { float: right; font-weight: bold; color: #e5c59a; }

        #viewer {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1400px;
            background: radial-gradient(circle, #3a3a48 0%, #1e1e24 100%);
            cursor: grab;
            overflow: hidden;
            position: relative;
        }
        
        #viewer:active { cursor: grabbing; }

        #stage {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .btn {
            background-color: #4a4a5a;
            color: #f5f5f5;
            border: 1px solid #666;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, color 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover { background-color: #5a5a6a; }
        
        .btn.active {
            background-color: #e5c59a;
            color: #1e1e24;
            font-weight: bold;
            border-color: #e5c59a;
        }

        #export-btn {
            background-color: #e5c59a;
            color: #1e1e24;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: auto;
            transition: background-color 0.2s;
        }

        #export-btn:hover { background-color: #d4b489; }

        #draw-overlay {
            display: none;
            position: absolute;
            background-color: #e5c59a;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #fff;
            touch-action: none; 
            cursor: crosshair;
        }

        #draw-overlay.active {
            display: block;
            z-index: 50;
        }
        
        .draw-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .checkbox-container input {
            width: auto;
            margin: 0;
            accent-color: #e5c59a;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h2>Parallax Settings v43</h2>

        <h3>Presets (Browser Save)</h3>
        <div class="control-group" style="display: flex; gap: 5px; align-items: center;">
            <select id="configSlot" style="flex: 1; padding: 6px; font-size: 0.9rem;">
                <option value="slot1">Preset Slot 1</option>
                <option value="slot2">Preset Slot 2</option>
                <option value="slot3">Preset Slot 3</option>
            </select>
            <button id="save-btn" class="btn" style="margin:0; width:auto; padding:6px 12px; background-color: #3b82f6; border-color: #2563eb;">Save</button>
            <button id="load-btn" class="btn" style="margin:0; width:auto; padding:6px 12px;">Load</button>
        </div>

        <h3>Dimensions & Layout</h3>
        <div class="control-group">
            <label>Canvas Width <span class="value-display" id="val-canvasWidth">800</span></label>
            <input type="range" id="canvasWidth" min="200" max="1200" step="10" value="800">
        </div>
        <div class="control-group">
            <label>Canvas Height <span class="value-display" id="val-canvasHeight">800</span></label>
            <input type="range" id="canvasHeight" min="200" max="1200" step="10" value="800">
        </div>
        
        <div class="control-group">
            <label>Layout Style</label>
            <select id="layout">
                <option value="image_moire" selected>Image Moire (B&W)</option>
                <option value="grid_squares">Halftone Grid (Squares)</option>
                <option value="grid_circles">Halftone Grid (Circles)</option>
                <option value="drawn_flow">Topographic (Single Spine)</option>
                <option value="multi_drawn_flow">Topographic (Multi-Spine)</option>
                <option value="golden_wave">Golden Wave</option>
                <option value="offset_muscle">Offset Fibers</option>
                <option value="muscle">Muscle Fibers</option>
                <option value="intersect">Intersecting Flow</option>
                <option value="vertical">Vertical Flow</option>
                <option value="horizontal">Horizontal Flow</option>
            </select>
        </div>

        <div id="draw-panel" style="display: none;">
            <button id="toggle-draw-btn" class="btn active">Edit Hand-Drawn Flow</button>
            <div class="draw-controls">
                <button id="clear-draw-btn" class="btn" style="background:#8a3a3a; border-color:#aa5a5a;">Clear Guide Lines</button>
            </div>
            <div class="control-group">
                <label>Spine Fluidity (Kernel) <span class="value-display" id="val-spineSmoothness">30</span></label>
                <input type="range" id="spineSmoothness" min="5" max="100" value="30">
            </div>
            <div class="control-group">
                <label>Field Broadness (Diffusion) <span class="value-display" id="val-fieldBroadness">60</span></label>
                <input type="range" id="fieldBroadness" min="20" max="150" value="60">
            </div>
        </div>

        <div id="image-panel" style="padding: 10px; background: #3b3b4a; border-radius: 6px; margin-bottom: 15px;">
            <div class="control-group">
                <label>Upload Target Image</label>
                <input type="file" id="imageUpload" accept="image/png, image/jpeg" style="color: #ccc; font-size: 0.8rem; margin-top: 5px;">
            </div>
            
            <div class="control-group">
                <label>Displacement Vector Field</label>
                <select id="imageDispMode" style="margin-top: 4px;">
                    <option value="horizontal_sym" selected>Symmetrical Horizontal (Outward from Center)</option>
                    <option value="horizontal">Standard Horizontal (Unidirectional)</option>
                    <option value="radial_canvas">Outward from Canvas Center</option>
                    <option value="radial_image">Bump Map (Image Gradients)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Image Map Scale X <span class="value-display" id="val-imageScaleX">1.0</span></label>
                <input type="range" id="imageScaleX" min="0.1" max="3.0" step="0.05" value="1.0">
            </div>
            <div class="control-group">
                <label>Image Map Scale Y <span class="value-display" id="val-imageScaleY">1.0</span></label>
                <input type="range" id="imageScaleY" min="0.1" max="3.0" step="0.05" value="1.0">
            </div>
            <div class="control-group" id="symBlendGroup">
                <label>Center Split Blending Width (Px) <span class="value-display" id="val-symBlendWidth">40</span></label>
                <input type="range" id="symBlendWidth" min="5" max="600" step="5" value="40">
            </div>
            <div class="control-group">
                <label><span id="label-imagePhase">Moire Phase Shift (%)</span> <span class="value-display" id="val-imagePhase">50</span></label>
                <input type="range" id="imagePhase" min="-100" max="100" value="50">
            </div>
            <div class="control-group" id="gridSizeVarGroup" style="display: none;">
                <label>Layer Shape Size Variation (%) <span class="value-display" id="val-gridSizeVariation">50</span></label>
                <input type="range" id="gridSizeVariation" min="-100" max="100" value="50">
            </div>
            
            <div class="control-group">
                <label>Path Smoothing (Anti-Jitter) <span class="value-display" id="val-imagePathSmoothing">15</span></label>
                <input type="range" id="imagePathSmoothing" min="0" max="50" value="15">
            </div>

            <div class="control-group" id="canvasCenterFalloffGroup" style="display: none;">
                <label>Z-Displacement Diffusion <span class="value-display" id="val-imageFalloffSmoothness">40</span></label>
                <input type="range" id="imageFalloffSmoothness" min="10" max="200" value="40">
            </div>
            <div class="checkbox-container">
                <input type="checkbox" id="imageInvert">
                <label for="imageInvert" style="margin:0;">Invert Image Colors</label>
            </div>
        </div>

        <div class="control-group">
            <label>Density (Ripple/Grid Spacing) <span class="value-display" id="val-density">45</span></label>
            <input type="range" id="density" min="10" max="150" value="45">
        </div>

        <div class="control-group">
            <label>Golden Curve Sweep <span class="value-display" id="val-sweep">50</span></label>
            <input type="range" id="sweep" min="-100" max="100" value="50">
        </div>

        <div class="control-group">
            <label>Turbulence <span class="value-display" id="val-turbulence">0</span></label>
            <input type="range" id="turbulence" min="0" max="100" value="0">
        </div>

        <div class="control-group">
            <label>Waviness Gradient <span class="value-display" id="val-gradient">0</span>%</label>
            <input type="range" id="gradient" min="-100" max="100" value="0">
        </div>

        <div class="control-group">
            <label>Base Angle (Degrees) <span class="value-display" id="val-angle">0</span></label>
            <input type="range" id="angle" min="-90" max="90" value="0">
        </div>

        <div class="control-group">
            <label>Minimum Line Thickness <span class="value-display" id="val-thickness">4</span></label>
            <input type="range" id="thickness" min="1" max="15" value="4">
        </div>

        <div class="control-group">
            <label>Added Shape/Line Width (Pulse) <span class="value-display" id="val-widthVar">4</span></label>
            <input type="range" id="widthVar" min="0" max="15" value="4">
        </div>

        <h3>Moire Displacement</h3>
        <div class="control-group">
            <label>Total Phase Shift (Twist) <span class="value-display" id="val-variation">20</span></label>
            <input type="range" id="variation" min="0" max="100" value="20">
        </div>
        <div class="control-group">
            <label>Horizontal Shift (X) <span class="value-display" id="val-shiftX">0</span></label>
            <input type="range" id="shiftX" min="-100" max="100" value="0">
        </div>
        <div class="control-group">
            <label>Vertical Shift (Y) <span class="value-display" id="val-shiftY">0</span></label>
            <input type="range" id="shiftY" min="-100" max="100" value="0">
        </div>

        <h3>Physical Structure</h3>
        <div class="control-group">
            <label>Wood Thickness (Vis Only) <span class="value-display" id="val-visualThickness">6</span></label>
            <input type="range" id="visualThickness" min="1" max="15" value="6">
        </div>
        <div class="control-group">
            <label>Pattern Border Width <span class="value-display" id="val-patternBorder">12</span></label>
            <input type="range" id="patternBorder" min="2" max="60" value="12">
        </div>
        <div class="control-group">
            <label>Main Frame Inner Corner Radius <span class="value-display" id="val-cornerRadius">15</span></label>
            <input type="range" id="cornerRadius" min="0" max="100" value="15">
        </div>
        
        <div class="control-group">
            <label>Line-to-Frame Fillet (Webbing) <span class="value-display" id="val-lineFilletRadius">10</span></label>
            <input type="range" id="lineFilletRadius" min="0" max="50" value="10">
        </div>

        <div class="control-group">
            <label>Spacer Border Width <span class="value-display" id="val-spacerBorder">18</span></label>
            <input type="range" id="spacerBorder" min="2" max="60" value="18">
        </div>
        <div class="control-group">
            <label>Patterned Layers <span class="value-display" id="val-patternLayers">3</span></label>
            <input type="range" id="patternLayers" min="2" max="4" value="3">
        </div>
        <div class="control-group">
            <label>Spacers Between Patterns <span class="value-display" id="val-spacers">1</span></label>
            <input type="range" id="spacers" min="0" max="3" value="1">
        </div>

        <h3>Layer Colors</h3>
        <div class="color-inputs">
            <div class="color-group"><label>Laser Burn</label><input type="color" id="color_edge" value="#2a1403"></div>
            <div class="color-group"><label>Solid Base</label><input type="color" id="color_solidBase" value="#ffffff"></div>
            <div class="color-group"><label>Pattern Btm</label><input type="color" id="color_patternBottom" value="#3b82f6"></div>
            <div class="color-group"><label>Pattern Mid</label><input type="color" id="color_patternMid" value="#2563eb"></div>
            <div class="color-group"><label>Pattern Top</label><input type="color" id="color_patternTop" value="#1d4ed8"></div>
            <div class="color-group"><label>Spacers</label><input type="color" id="color_spacerFrame" value="#b0865a"></div>
        </div>

        <h3>Animation</h3>
        <button id="anim-btn" class="btn">Start Auto-Pan</button>
        <div class="control-group" style="margin-bottom: 20px;">
            <label>Pan Speed <span class="value-display" id="val-animSpeed">50</span></label>
            <input type="range" id="animSpeed" min="5" max="100" value="50">
        </div>

        <button id="export-btn">Export to SVG</button>
    </div>

    <div id="viewer">
        <div id="stage"></div>
        <canvas id="draw-overlay"></canvas>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const viewer = document.getElementById('viewer');
        const exportBtn = document.getElementById('export-btn');
        const animBtn = document.getElementById('anim-btn');
        
        const drawOverlay = document.getElementById('draw-overlay');
        const drawCtx = drawOverlay.getContext('2d');
        const toggleDrawBtn = document.getElementById('toggle-draw-btn');
        const clearDrawBtn = document.getElementById('clear-draw-btn');
        const layoutSelect = document.getElementById('layout');
        
        const drawPanel = document.getElementById('draw-panel');
        const imagePanel = document.getElementById('image-panel');
        const imageDispMode = document.getElementById('imageDispMode');
        const canvasCenterFalloffGroup = document.getElementById('canvasCenterFalloffGroup');
        const symBlendGroup = document.getElementById('symBlendGroup');
        const imagePhaseLabel = document.getElementById('label-imagePhase');
        const gridSizeVarGroup = document.getElementById('gridSizeVarGroup');

        const configSlot = document.getElementById('configSlot');
        const saveBtn = document.getElementById('save-btn');
        const loadBtn = document.getElementById('load-btn');

        const imageUpload = document.getElementById('imageUpload');
        const imageInvert = document.getElementById('imageInvert');
        const hiddenCanvas = document.createElement('canvas');
        const hCtx = hiddenCanvas.getContext('2d');
        let moireImgData = null;

        const inputs = [
            'canvasWidth', 'canvasHeight', 'layout', 'density', 'imageScaleX', 'imageScaleY', 'symBlendWidth', 'spineSmoothness', 'fieldBroadness', 'sweep', 'turbulence', 'gradient', 'angle', 
            'thickness', 'widthVar', 'variation', 'shiftX', 'shiftY', 'visualThickness', 
            'patternBorder', 'spacerBorder', 'cornerRadius', 'lineFilletRadius', 'patternLayers', 'spacers', 'animSpeed', 'imagePhase', 'gridSizeVariation', 'imageFalloffSmoothness', 'imageDispMode', 'imagePathSmoothing',
            'color_edge', 'color_solidBase', 'color_patternBottom', 'color_patternMid', 'color_patternTop', 'color_spacerFrame'
        ];
        
        const state = {};
        let isAutoAnimating = false;
        let isDrawingMode = false;

        let rawStrokes = [];
        let userStrokes = [];
        let currentStroke = null;
        let isPointerDown = false;

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    hiddenCanvas.width = img.width;
                    hiddenCanvas.height = img.height;
                    hCtx.drawImage(img, 0, 0);
                    moireImgData = hCtx.getImageData(0, 0, img.width, img.height);
                    if (!isDrawingMode) generateArt();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        imageInvert.addEventListener('change', () => {
            if (!isDrawingMode) generateArt();
        });

        function getBrightness(x, y, cWidth, cHeight) {
            if (!moireImgData) return 0;
            
            let nx = x / cWidth;
            let ny = y / cHeight;
            if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return 0;

            let ix = Math.floor(nx * (moireImgData.width - 1));
            let iy = Math.floor(ny * (moireImgData.height - 1));

            let idx = (iy * moireImgData.width + ix) * 4;
            let r = moireImgData.data[idx];
            let g = moireImgData.data[idx+1];
            let b = moireImgData.data[idx+2];
            
            let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
            
            if (imageInvert.checked) {
                lum = 1.0 - lum;
            }
            return lum;
        }

        inputs.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            state[id] = el.value;
            
            el.addEventListener('input', (e) => {
                state[id] = el.value;
                if(document.getElementById(`val-${id}`)) {
                    document.getElementById(`val-${id}`).innerText = el.value;
                }
                
                if (id === 'imageDispMode') {
                    if (el.value === 'radial_canvas') {
                        canvasCenterFalloffGroup.style.display = 'block';
                        symBlendGroup.style.display = 'none';
                    } else if (el.value === 'horizontal_sym') {
                        canvasCenterFalloffGroup.style.display = 'none';
                        symBlendGroup.style.display = 'block';
                    } else {
                        canvasCenterFalloffGroup.style.display = 'none';
                        symBlendGroup.style.display = 'none';
                    }
                }

                if (id === 'layout') {
                    if (el.value.startsWith('grid_')) {
                        imagePhaseLabel.innerText = "Grid Shape Max Scale (%)";
                        gridSizeVarGroup.style.display = 'block';
                    } else {
                        imagePhaseLabel.innerText = "Moire Phase Shift (%)";
                        gridSizeVarGroup.style.display = 'none';
                    }

                    if (el.value === 'drawn_flow' || el.value === 'multi_drawn_flow') {
                        drawPanel.style.display = 'block';
                        imagePanel.style.display = 'none';
                        enterDrawingMode();
                    } else if (el.value === 'image_moire' || el.value.startsWith('grid_')) {
                        drawPanel.style.display = 'none';
                        imagePanel.style.display = 'block';
                        
                        if (state.imageDispMode === 'radial_canvas') {
                            canvasCenterFalloffGroup.style.display = 'block';
                            symBlendGroup.style.display = 'none';
                        } else if (state.imageDispMode === 'horizontal_sym') {
                            canvasCenterFalloffGroup.style.display = 'none';
                            symBlendGroup.style.display = 'block';
                        } else {
                            canvasCenterFalloffGroup.style.display = 'none';
                            symBlendGroup.style.display = 'none';
                        }
                        exitDrawingMode();
                    } else {
                        drawPanel.style.display = 'none';
                        imagePanel.style.display = 'none';
                        exitDrawingMode();
                    }
                }
                
                if (id === 'canvasWidth' || id === 'canvasHeight') {
                    updateDrawCanvasSize();
                }

                if (id === 'spineSmoothness' || id === 'cornerRadius' || id === 'lineFilletRadius') {
                    applySmoothingAndRender();
                    if (!isDrawingMode) generateArt();
                } else if(id !== 'animSpeed' && !isDrawingMode) {
                    generateArt();
                }
            });
        });

        saveBtn.addEventListener('click', () => {
            const dataToSave = {
                state: state,
                rawStrokes: rawStrokes
            };
            localStorage.setItem('parallax_' + configSlot.value, JSON.stringify(dataToSave));
            alert('Settings successfully saved to ' + configSlot.options[configSlot.selectedIndex].text + '!');
        });

        loadBtn.addEventListener('click', () => {
            const savedData = localStorage.getItem('parallax_' + configSlot.value);
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    for (let key in parsed.state) {
                        if (state.hasOwnProperty(key)) {
                            state[key] = parsed.state[key];
                            const el = document.getElementById(key);
                            if (el) {
                                el.value = state[key];
                                if (document.getElementById(`val-${key}`)) {
                                    document.getElementById(`val-${key}`).innerText = state[key];
                                }
                            }
                        }
                    }

                    if (state.layout.startsWith('grid_')) {
                        imagePhaseLabel.innerText = "Grid Shape Max Scale (%)";
                        gridSizeVarGroup.style.display = 'block';
                    } else {
                        imagePhaseLabel.innerText = "Moire Phase Shift (%)";
                        gridSizeVarGroup.style.display = 'none';
                    }

                    if (state.layout === 'drawn_flow' || state.layout === 'multi_drawn_flow') {
                        drawPanel.style.display = 'block';
                        imagePanel.style.display = 'none';
                    } else if (state.layout === 'image_moire' || state.layout.startsWith('grid_')) {
                        drawPanel.style.display = 'none';
                        imagePanel.style.display = 'block';
                        if (state.imageDispMode === 'radial_canvas') {
                            canvasCenterFalloffGroup.style.display = 'block';
                            symBlendGroup.style.display = 'none';
                        } else if (state.imageDispMode === 'horizontal_sym') {
                            canvasCenterFalloffGroup.style.display = 'none';
                            symBlendGroup.style.display = 'block';
                        } else {
                            canvasCenterFalloffGroup.style.display = 'none';
                            symBlendGroup.style.display = 'none';
                        }
                    } else {
                        drawPanel.style.display = 'none';
                        imagePanel.style.display = 'none';
                    }

                    if (parsed.rawStrokes) {
                        rawStrokes = parsed.rawStrokes;
                        applySmoothingAndRender();
                    } else if (parsed.rawStroke) {
                        rawStrokes = [parsed.rawStroke];
                        applySmoothingAndRender();
                    } else {
                        rawStrokes = [];
                        userStrokes = [];
                        renderStrokes();
                    }

                    updateDrawCanvasSize();
                    if (!isDrawingMode) generateArt();
                    
                } catch(e) {
                    console.error("Failed to parse local storage configuration.");
                }
            } else {
                alert("No saved configuration found in this slot.");
            }
        });

        function updateDrawCanvasSize() {
            drawOverlay.width = parseInt(state.canvasWidth);
            drawOverlay.height = parseInt(state.canvasHeight);
            drawOverlay.style.width = state.canvasWidth + 'px';
            drawOverlay.style.height = state.canvasHeight + 'px';
            renderStrokes();
        }

        function enterDrawingMode() {
            isDrawingMode = true;
            isAutoAnimating = false;
            animBtn.textContent = 'Start Auto-Pan';
            animBtn.classList.remove('active');
            
            currentRotX = 0; currentRotY = 0;
            targetRotX = 0; targetRotY = 0;
            stage.style.transform = `rotateX(0deg) rotateY(0deg)`;
            
            drawOverlay.classList.add('active');
            toggleDrawBtn.textContent = 'Apply & View 3D';
            toggleDrawBtn.style.backgroundColor = '#10b981';
            toggleDrawBtn.style.borderColor = '#059669';
            updateDrawCanvasSize();
        }

        function exitDrawingMode() {
            isDrawingMode = false;
            drawOverlay.classList.remove('active');
            toggleDrawBtn.textContent = 'Edit Hand-Drawn Flow';
            toggleDrawBtn.style.backgroundColor = '';
            toggleDrawBtn.style.borderColor = '';
            generateArt();
        }

        toggleDrawBtn.addEventListener('click', () => {
            if (isDrawingMode) exitDrawingMode();
            else enterDrawingMode();
        });

        clearDrawBtn.addEventListener('click', () => {
            userStrokes = [];
            rawStrokes = [];
            renderStrokes();
        });

        drawOverlay.addEventListener('pointerdown', (e) => {
            if (!isDrawingMode) return;
            isPointerDown = true;
            const rect = drawOverlay.getBoundingClientRect();
            const scaleX = drawOverlay.width / rect.width;
            const scaleY = drawOverlay.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            currentStroke = [{x, y}];
            
            if (state.layout !== 'multi_drawn_flow') {
                userStrokes = [currentStroke];
            } else {
                userStrokes.push(currentStroke);
            }
            renderStrokes();
        });

        drawOverlay.addEventListener('pointermove', (e) => {
            if (!isPointerDown || !isDrawingMode || !currentStroke) return;
            const rect = drawOverlay.getBoundingClientRect();
            const scaleX = drawOverlay.width / rect.width;
            const scaleY = drawOverlay.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            const lastPt = currentStroke[currentStroke.length - 1];
            if (Math.hypot(x - lastPt.x, y - lastPt.y) > 3) {
                currentStroke.push({x, y});
                renderStrokes();
            }
        });

        window.addEventListener('pointerup', () => {
            if (isPointerDown && currentStroke && currentStroke.length > 2) {
                if (state.layout !== 'multi_drawn_flow') {
                    rawStrokes = [[...currentStroke]];
                } else {
                    rawStrokes.push([...currentStroke]);
                }
                applySmoothingAndRender();
            }
            isPointerDown = false;
            currentStroke = null;
        });

        function applySmoothingAndRender() {
            if (!rawStrokes || rawStrokes.length === 0) return;
            
            const fluidity = parseInt(state.spineSmoothness);
            const decimationDist = Math.max(5, fluidity * 1.5);
            
            userStrokes = rawStrokes.map(raw => {
                if (raw.length < 2) return raw;
                let decimated = resampleStroke(raw, decimationDist);
                let smoothed = smoothStroke(decimated, 4); 
                return resampleStroke(smoothed, 3);
            });
            
            renderStrokes();
        }

        function resampleStroke(pts, spacing) {
            if (pts.length < 2) return pts;
            let res = [pts[0]];
            let distSinceLast = 0;
            for (let i = 1; i < pts.length; i++) {
                let prev = pts[i-1];
                let curr = pts[i];
                let dx = curr.x - prev.x;
                let dy = curr.y - prev.y;
                let segLen = Math.hypot(dx, dy);
                let distToNext = spacing - distSinceLast;

                while (segLen >= distToNext) {
                    let t = distToNext / segLen;
                    let nx = prev.x + dx * t;
                    let ny = prev.y + dy * t;
                    res.push({x: nx, y: ny});
                    prev = {x: nx, y: ny};
                    dx = curr.x - prev.x;
                    dy = curr.y - prev.y;
                    segLen = Math.hypot(dx, dy);
                    distSinceLast = 0;
                    distToNext = spacing;
                }
                distSinceLast += segLen;
            }
            if (distSinceLast > 0) res.push(pts[pts.length - 1]);
            return res;
        }

        function smoothStroke(points, iterations) {
            let current = points;
            for (let iter = 0; iter < iterations; iter++) {
                let smoothed = [];
                smoothed.push(current[0]);
                for (let i = 0; i < current.length - 1; i++) {
                    const p0 = current[i];
                    const p1 = current[i + 1];
                    smoothed.push({ x: p0.x * 0.75 + p1.x * 0.25, y: p0.y * 0.75 + p1.y * 0.25 });
                    smoothed.push({ x: p0.x * 0.25 + p1.x * 0.75, y: p0.y * 0.25 + p1.y * 0.75 });
                }
                smoothed.push(current[current.length - 1]);
                current = smoothed;
            }
            return current;
        }

        function renderStrokes() {
            drawCtx.clearRect(0, 0, drawOverlay.width, drawOverlay.height);
            
            drawCtx.fillStyle = '#1e1e24';
            drawCtx.font = '16px sans-serif';
            drawCtx.textAlign = 'center';
            if (userStrokes.length === 0) {
                if (state.layout === 'multi_drawn_flow') {
                    drawCtx.fillText('Draw a Genesis spine first. Then draw modifying Gravity Wells.', drawOverlay.width/2, drawOverlay.height/2);
                } else {
                    drawCtx.fillText('Draw a spine curve here. Ripples will mathematically expand outwards.', drawOverlay.width/2, drawOverlay.height/2);
                }
            }

            userStrokes.forEach((stroke, index) => {
                if (stroke.length < 2) return;
                
                if (!isPointerDown) {
                    if (state.layout === 'multi_drawn_flow' && index > 0) {
                        drawCtx.strokeStyle = '#e5c59a'; 
                    } else {
                        drawCtx.strokeStyle = '#3b82f6'; 
                    }
                    drawCtx.lineWidth = 5;
                } else {
                    if (index === userStrokes.length - 1) {
                         drawCtx.strokeStyle = '#2b2b36'; 
                         drawCtx.lineWidth = 4;
                    } else {
                         drawCtx.strokeStyle = (index === 0) ? '#3b82f6' : '#e5c59a';
                         drawCtx.lineWidth = 5;
                    }
                }

                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                drawCtx.beginPath();
                drawCtx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    drawCtx.lineTo(stroke[i].x, stroke[i].y);
                }
                drawCtx.stroke();
            });
        }

        // ---------------------------------------------------------
        // 3D VIEWER AND ANIMATION LOGIC
        // ---------------------------------------------------------
        let targetRotX = 0, targetRotY = 0;
        let currentRotX = 0, currentRotY = 0;

        animBtn.addEventListener('click', () => {
            if (isDrawingMode) {
                exitDrawingMode();
            }
            
            isAutoAnimating = !isAutoAnimating;
            if (isAutoAnimating) {
                animBtn.textContent = 'Stop Auto-Pan';
                animBtn.classList.add('active');
            } else {
                animBtn.textContent = 'Start Auto-Pan';
                animBtn.classList.remove('active');
            }
        });

        viewer.addEventListener('mousemove', (e) => {
            if (isDrawingMode) return;
            if (isAutoAnimating && e.buttons > 0) {
                isAutoAnimating = false;
                animBtn.textContent = 'Start Auto-Pan';
                animBtn.classList.remove('active');
            }
            
            if (!isAutoAnimating) {
                const rect = viewer.getBoundingClientRect();
                targetRotY = ((e.clientX - rect.left) / rect.width - 0.5) * 60;
                targetRotX = ((e.clientY - rect.top) / rect.height - 0.5) * -60;
            }
        });

        viewer.addEventListener('touchmove', (e) => {
            if (isDrawingMode) return;
            if (isAutoAnimating) {
                isAutoAnimating = false;
                animBtn.textContent = 'Start Auto-Pan';
                animBtn.classList.remove('active');
            }
            const rect = viewer.getBoundingClientRect();
            const touch = e.touches[0];
            targetRotY = ((touch.clientX - rect.left) / rect.width - 0.5) * 60;
            targetRotX = ((touch.clientY - rect.top) / rect.height - 0.5) * -60;
        });

        function animate() {
            if (!isDrawingMode) {
                if (isAutoAnimating) {
                    const speed = parseInt(state.animSpeed) * 0.000015;
                    const time = performance.now();
                    targetRotY = Math.sin(time * speed) * 40;
                    targetRotX = 10; 
                }
                currentRotX += (targetRotX - currentRotX) * 0.1;
                currentRotY += (targetRotY - currentRotY) * 0.1;
                stage.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
            }
            requestAnimationFrame(animate);
        }
        animate();

        function generatePolygonFromPath(points) {
            if (points.length < 2) return null;
            let leftEdge = [], rightEdge = [];
            for (let i = 0; i < points.length; i++) {
                let p1, p2;
                if (i === 0) { p1 = points[0]; p2 = points[1]; }
                else if (i === points.length - 1) { p1 = points[i - 1]; p2 = points[i]; }
                else { p1 = points[i - 1]; p2 = points[i + 1]; }

                let dx = p2.x - p1.x, dy = p2.y - p1.y;
                let len = Math.sqrt(dx*dx + dy*dy);
                if (len === 0) { dx = 1; dy = 0; len = 1; }
                
                let nx = -dy / len, ny = dx / len;
                leftEdge.push({ x: points[i].x + nx * points[i].w, y: points[i].y + ny * points[i].w });
                rightEdge.push({ x: points[i].x - nx * points[i].w, y: points[i].y - ny * points[i].w });
            }
            return { leftEdge, rightEdge };
        }

        function drawPolygon(ctx, poly) {
            if (!poly) return;
            ctx.moveTo(poly.leftEdge[0].x, poly.leftEdge[0].y);
            for (let i = 1; i < poly.leftEdge.length; i++) ctx.lineTo(poly.leftEdge[i].x, poly.leftEdge[i].y);
            for (let i = poly.rightEdge.length - 1; i >= 0; i--) ctx.lineTo(poly.rightEdge[i].x, poly.rightEdge[i].y);
            ctx.closePath();
        }

        function getGradMult(posX, cWidth) {
            const grad = parseFloat(state.gradient) / 100; 
            const cx = cWidth / 2;
            const tPos = Math.abs(posX - cx) / cx; 
            return Math.max(0, (1 - grad) + (tPos * grad));
        }

        function getGridShapes(progress, phase, cWidth, cHeight, layerOffsetX, layerOffsetY) {
            const density = parseInt(state.density) || 45;
            const step = Math.max(cWidth, cHeight) / density;
            const thickness = parseInt(state.thickness) || 4;
            const halfThick = thickness / 2;
            
            const scaleFactor = Math.abs(parseFloat(state.imagePhase)) / 50.0; 
            const sizeVarPhase = parseFloat(state.gridSizeVariation) / 100.0;
            
            const imgScaleX = parseFloat(state.imageScaleX) || 1.0;
            const imgScaleY = parseFloat(state.imageScaleY) || 1.0;
            const turbulence = parseInt(state.turbulence) || 0;
            const angleRad = (parseInt(state.angle) || 0) * (Math.PI / 180);
            const cx = cWidth / 2;
            const cy = cHeight / 2;
            
            let shapes = { circles: [], rects: [], vPaths: [], hPaths: [] };
            const isCircle = state.layout === 'grid_circles';
            
            const maxDist = Math.sqrt(cx*cx + cy*cy) * 1.5; 
            let startX = cx - maxDist;
            let endX = cx + maxDist;
            let startY = cy - maxDist;
            let endY = cy + maxDist;

            let nodes = [];

            for (let x = startX; x <= endX; x += step) {
                let col = [];
                for (let y = startY; y <= endY; y += step) {
                    let baseAbsX = x + layerOffsetX;
                    let baseAbsY = y + layerOffsetY;
                    
                    let mapX = cx + (baseAbsX - cx) * imgScaleX;
                    let mapY = cy + (baseAbsY - cy) * imgScaleY;
                    let brightness = getBrightness(mapX, mapY, cWidth, cHeight);
                    
                    let dx = 0;
                    let dy = 0;

                    let localTurb = turbulence * getGradMult(baseAbsX, cWidth);
                    if (localTurb > 0) {
                        dx += Math.sin((baseAbsY * 0.012) + phase * 1.1) * localTurb * 1.2;
                    }

                    let finalX = baseAbsX + dx;
                    let finalY = baseAbsY + dy;

                    if (angleRad !== 0) {
                        let rotX = Math.cos(angleRad) * (finalX - cx) - Math.sin(angleRad) * (finalY - cy) + cx;
                        let rotY = Math.sin(angleRad) * (finalX - cx) + Math.cos(angleRad) * (finalY - cy) + cy;
                        finalX = rotX;
                        finalY = rotY;
                    }

                    let pulseSine = (Math.sin((baseAbsY * 0.02) + phase) + 1) / 2;
                    let minShapeSize = thickness * 1.6;
                    let baseSizeVariation = (parseInt(state.widthVar) || 0) * pulseSine;
                    
                    let layerProgress = (progress - 0.5) * 2.0; 
                    let layerScale = 1.0 + (layerProgress * sizeVarPhase * brightness);

                    let dynamicSize = ((step * 1.5 * scaleFactor * brightness) + baseSizeVariation) * layerScale; 
                    let size = Math.max(0.1, Math.max(minShapeSize, dynamicSize));

                    col.push({ x: finalX, y: finalY, size: size, w: halfThick });
                }
                nodes.push(col);
            }

            for (let c = 0; c < nodes.length; c++) {
                for (let r = 0; r < nodes[c].length; r++) {
                    let n = nodes[c][r];
                    if (n.x > -step*2 && n.x < cWidth + step*2 && n.y > -step*2 && n.y < cHeight + step*2) {
                        if (isCircle) shapes.circles.push({x: n.x, y: n.y, r: Math.max(0.1, n.size/2)});
                        else shapes.rects.push({x: n.x - n.size/2, y: n.y - n.size/2, w: Math.max(0.1, n.size), h: Math.max(0.1, n.size)});
                    }
                }
            }

            for (let c = 0; c < nodes.length; c++) {
                let path = [];
                for (let r = 0; r < nodes[c].length; r++) {
                    path.push(nodes[c][r]);
                }
                shapes.vPaths.push(path);
            }

            for (let r = 0; r < nodes[0].length; r++) {
                let path = [];
                for (let c = 0; c < nodes.length; c++) {
                    path.push(nodes[c][r]);
                }
                shapes.hPaths.push(path);
            }

            return shapes;
        }

        function calculatePaths(phase, cWidth, cHeight, offsetX = 0, offsetY = 0) {
            const layout = state.layout;
            const density = parseInt(state.density) || 45;
            const turbulence = parseInt(state.turbulence) || 0;
            const baseThick = (parseInt(state.thickness) || 4) / 2;
            const varThick = (parseInt(state.widthVar) || 4) / 2;
            const cx = cWidth / 2;
            const cy = cHeight / 2;
            const maxDist = Math.sqrt((cx)**2 + (cy)**2) * 1.5; 
            const linearStep = 2.0; 
            let allPaths = [];
            const step = Math.max(cWidth, cHeight) / density;

            let xCoords = [];
            let halfStep = step / 2;
            for (let x = cx + halfStep; x <= cWidth + maxDist; x += step) xCoords.push(x);
            for (let x = cx - halfStep; x >= -maxDist; x -= step) xCoords.push(x);
            xCoords.sort((a,b) => a - b);

            const imgScaleX = parseFloat(state.imageScaleX) || 1.0;
            const imgScaleY = parseFloat(state.imageScaleY) || 1.0;
            const symBlendWidth = parseInt(state.symBlendWidth) || 40;

            if (layout === 'image_moire') {
                const imgPhase = parseFloat(state.imagePhase) / 100.0;
                const maxDisplacement = step * imgPhase;
                
                const imgDispMode = state.imageDispMode || 'horizontal_sym';
                const pathSmoothWindow = parseInt(state.imagePathSmoothing) || 0;
                
                const falloffSmoothness = parseInt(state.imageFalloffSmoothness) || 40;
                let variance = Math.max(1, falloffSmoothness * falloffSmoothness * 10);
                let cutoffSq = variance * 9; 

                const isDeformedLayer = phase > 0.001; 

                for (let x of xCoords) {
                    let points = [];
                    let currentX = x + offsetX;
                    let localTurb = turbulence * getGradMult(currentX, cWidth);

                    for (let y = -maxDist; y <= cHeight + maxDist; y += linearStep) {
                        let evalY = y + offsetY;
                        let dx = 0;
                        let dy = 0;

                        if (isDeformedLayer) {
                            let mapX = cx + (currentX - cx) * imgScaleX;
                            let mapY = cy + (evalY - cy) * imgScaleY;
                            let brightness = getBrightness(mapX, mapY, cWidth, cHeight);
                            
                            if (imgDispMode === 'radial_canvas') {
                                let vx = currentX - cx;
                                let vy = evalY - cy;
                                let distSq = vx*vx + vy*vy;
                                let dist = Math.sqrt(distSq);
                                
                                let falloff = 0;
                                if (distSq < cutoffSq) {
                                    falloff = Math.exp(-distSq / variance); 
                                }

                                let nx = 0, ny = 0; 
                                if (dist > 0.1) {
                                    nx = vx / dist;
                                    ny = vy / dist;
                                }

                                let rampDist = 40.0;
                                let ramp = Math.min(1.0, dist / rampDist);
                                let smoothRamp = ramp * ramp * (3 - 2 * ramp);

                                let totalDisplacement = brightness * maxDisplacement * falloff * smoothRamp;
                                dx = nx * totalDisplacement;
                                dy = ny * totalDisplacement;
                                
                            } else if (imgDispMode === 'radial_image') {
                                let eps = 8.0; 
                                let bRight = getBrightness(mapX + eps, mapY, cWidth, cHeight);
                                let bLeft = getBrightness(mapX - eps, mapY, cWidth, cHeight);
                                let bBottom = getBrightness(mapX, mapY + eps, cWidth, cHeight);
                                let bTop = getBrightness(mapX, mapY - eps, cWidth, cHeight);

                                let gradX = bRight - bLeft;
                                let gradY = bBottom - bTop;
                                
                                let slopeFactor = maxDisplacement * 2.0; 
                                dx = -gradX * slopeFactor;
                                dy = -gradY * slopeFactor;
                                
                            } else if (imgDispMode === 'horizontal_sym') {
                                let vx = currentX - cx;
                                let sideMult = (vx >= 0) ? 1 : -1;
                                let distFromCenter = Math.abs(vx);
                                
                                let ramp = Math.min(1.0, distFromCenter / Math.max(1, symBlendWidth));
                                let smoothRamp = ramp * ramp * (3 - 2 * ramp);
                                
                                dx = brightness * maxDisplacement * sideMult * smoothRamp;
                            } else {
                                dx = brightness * maxDisplacement;
                            }
                        }
                        
                        dx += Math.sin((evalY * 0.012) + phase * 1.1) * localTurb * 1.2 + Math.sin((evalY * 0.033) - phase * 0.4) * (localTurb * 0.4);

                        let pulseSine = (Math.sin((evalY * 0.02) + phase) + 1) / 2; 
                        points.push({ x: currentX + dx, y: y + dy, w: Math.max(0.1, baseThick + (pulseSine * varThick)) });
                    }
                    
                    if (pathSmoothWindow > 0 && isDeformedLayer) {
                        let smoothedPoints = [];
                        for (let i = 0; i < points.length; i++) {
                            let sumX = 0, sumY = 0, sumW = 0, count = 0;
                            for (let j = -pathSmoothWindow; j <= pathSmoothWindow; j++) {
                                let idx = i + j;
                                if (idx >= 0 && idx < points.length) {
                                    sumX += points[idx].x;
                                    sumY += points[idx].y;
                                    sumW += points[idx].w;
                                    count++;
                                }
                            }
                            smoothedPoints.push({ x: sumX/count, y: sumY/count, w: Math.max(0.1, sumW/count) });
                        }
                        points = smoothedPoints;
                    }

                    allPaths.push(points);
                }
            } 
            else if (layout === 'drawn_flow' || layout === 'multi_drawn_flow') {
                let allSpinePts = [];
                let firstSpineMid = null;
                let firstSpineNormal = null;
                
                let activeStrokes = userStrokes.length > 0 ? userStrokes : [];

                if (activeStrokes.length === 0) {
                    let defSpine = [];
                    for(let y = -maxDist; y <= cHeight+maxDist; y+=10) defSpine.push({x: cx, y: y});
                    activeStrokes = [defSpine];
                }

                activeStrokes.forEach((stroke, strokeIdx) => {
                    let spinePts = [...stroke];
                    if (spinePts.length < 2) return;

                    for (let i=0; i<spinePts.length; i++) {
                        let prev = i > 0 ? spinePts[i-1] : spinePts[i];
                        let next = i < spinePts.length-1 ? spinePts[i+1] : spinePts[i];
                        if (i===0) prev = {x: spinePts[0].x - (spinePts[1].x-spinePts[0].x), y: spinePts[0].y - (spinePts[1].y-spinePts[0].y)};
                        if (i===spinePts.length-1) next = {x: spinePts[i].x + (spinePts[i].x-spinePts[i-1].x), y: spinePts[i].y + (spinePts[i].y-spinePts[i-1].y)};
                        
                        let dx = next.x - prev.x, dy = next.y - prev.y;
                        let mag = Math.hypot(dx, dy);
                        spinePts[i] = { x: spinePts[i].x, y: spinePts[i].y, tangent: mag > 0 ? {x: dx/mag, y: dy/mag} : {x: 1, y: 0} };
                    }

                    if (strokeIdx === 0) {
                        let midIdx = Math.floor(spinePts.length / 2);
                        firstSpineMid = spinePts[midIdx];
                        firstSpineNormal = { x: -spinePts[midIdx].tangent.y, y: spinePts[midIdx].tangent.x };
                    }

                    allSpinePts = allSpinePts.concat(spinePts);
                });

                if (!firstSpineMid) return [];

                let maxOffset = Math.max(cWidth, cHeight) * 2.0;
                let spineSmoothness = parseInt(state.spineSmoothness) || 30; 
                let variance = Math.max(1, spineSmoothness * spineSmoothness * 10); 
                let cutoffSq = variance * 9; 
                
                const fieldBroadness = parseInt(state.fieldBroadness) || 60; 
                const broadeningFactor = fieldBroadness * 0.05;

                const traceStreamline = (seed, direction) => {
                    let path = [];
                    let p = {x: seed.x, y: seed.y};
                    let steps = 0;
                    
                    let minDistSqInit = Infinity;
                    let bestIdxInit = 0;
                    for(let i=0; i<allSpinePts.length; i++) {
                        let distSq = (p.x - allSpinePts[i].x)**2 + (p.y - allSpinePts[i].y)**2;
                        if (distSq < minDistSqInit) { minDistSqInit = distSq; bestIdxInit = i; }
                    }
                    let nearestTInit = allSpinePts[bestIdxInit].tangent;
                    let prevT = {x: nearestTInit.x * direction, y: nearestTInit.y * direction};

                    while(steps < 1000) {
                        let sumW = 0, sumTx = 0, sumTy = 0;

                        for (let pt of allSpinePts) {
                            let distSq = (p.x - pt.x)**2 + (p.y - pt.y)**2;
                            if (distSq > cutoffSq) continue;
                            
                            let w = Math.exp(-distSq / variance); 
                            sumW += w;
                            
                            let tx = pt.tangent.x;
                            let ty = pt.tangent.y;

                            if (tx * prevT.x + ty * prevT.y < 0) {
                                tx = -tx; ty = -ty;
                            }

                            sumTx += tx * w;
                            sumTy += ty * w;
                        }

                        let Tx = prevT.x, Ty = prevT.y; 
                        if (sumW > 1e-6) {
                            let tX_temp = sumTx / sumW;
                            let tY_temp = sumTy / sumW;
                            let mag = Math.hypot(tX_temp, tY_temp);
                            if (mag > 1e-6) {
                                Tx = tX_temp / mag;
                                Ty = tY_temp / mag;
                            }
                        }
                        
                        prevT = {x: Tx, y: Ty};

                        let evalX = p.x + offsetX, evalY = p.y + offsetY;
                        let localTurb = turbulence * getGradMult(evalX, cWidth);
                        let waveAngle = Math.sin((evalY * 0.015) + (Math.abs(evalX - cx) * 0.01) + phase) * (localTurb * 0.01);

                        let cosW = Math.cos(waveAngle);
                        let sinW = Math.sin(waveAngle);
                        let rotTx = Tx * cosW - Ty * sinW;
                        let rotTy = Tx * sinW + Ty * cosW;

                        p.x += rotTx * linearStep;
                        p.y += rotTy * linearStep;

                        let pulseSine = (Math.sin((evalY * 0.02) + phase) + 1) / 2; 
                        
                        let distFromMidSq = (p.x - firstSpineMid.x)**2 + (p.y - firstSpineMid.y)**2;
                        let broadFactor = 1 + (distFromMidSq / (maxDist*maxDist)) * broadeningFactor;

                        path.push({ x: p.x - offsetX, y: p.y - offsetY, w: Math.max(0.1, (baseThick + (pulseSine * varThick)) * broadFactor) });

                        if (p.x < -maxDist*1.5 || p.x > cWidth+maxDist*1.5 || p.y < -maxDist*1.5 || p.y > cHeight+maxDist*1.5) break;
                        steps++;
                    }
                    return path;
                };

                for (let dir of [1, -1]) {
                    for (let off = step / 2; off <= maxOffset; off += step) {
                        let seed = { x: firstSpineMid.x + firstSpineNormal.x * off * dir, y: firstSpineMid.y + firstSpineNormal.y * off * dir };
                        
                        let forward = traceStreamline(seed, 1);
                        let backward = traceStreamline(seed, -1);
                        backward.reverse();
                        
                        if (backward.length > 0) {
                            backward.pop(); 
                        }
                        
                        let fullPath = backward.concat(forward);
                        if (fullPath.length > 5) allPaths.push(fullPath);
                    }
                }
            } 
            else if (layout === 'golden_wave') {
                const sweepVal = parseFloat(state.sweep) / 50; 
                for (let x of xCoords) {
                    let points = []; let px = x + offsetX; let py = -maxDist; 
                    for (let t = 0; t <= (cHeight + maxDist * 3); t += linearStep) {
                        let evalX = px; let evalY = py + offsetY;
                        let localTurb = turbulence * getGradMult(evalX, cWidth);
                        let normY = Math.max(0, (py + maxDist) / (cHeight + maxDist * 2));
                        let curveAngle = sweepVal * (Math.pow(1.618, normY * 4) - 1) * 0.25;
                        let waveAngle = Math.sin((evalY * 0.015) + (Math.abs(evalX - cx) * 0.01) + phase) * (localTurb * 0.01);
                        let theta = curveAngle + waveAngle;
                        px += linearStep * Math.sin(theta); py += linearStep * Math.cos(theta);
                        let pulseSine = (Math.sin((evalY * 0.02) + phase) + 1) / 2; 
                        points.push({ x: px - offsetX, y: py, w: Math.max(0.1, baseThick + (pulseSine * varThick)) });
                        if (px > cWidth + maxDist || px < -maxDist || py > cHeight + maxDist) break;
                    }
                    if (points.length > 5) allPaths.push(points);
                }
            }
            else {
                for (let x of xCoords) {
                    let points = [];
                    let currentX = x + (layout === 'intersect' ? (Math.random() - 0.5) * step * 0.2 : 0);
                    let evalX = currentX + offsetX;
                    let localTurb = turbulence * getGradMult(evalX, cWidth);

                    for (let y = -maxDist; y <= cHeight + maxDist; y += linearStep) {
                        let evalY = y + offsetY;
                        let dx;
                        
                        if (layout === 'offset_muscle') {
                            let envelope = Math.sin((evalY * 0.006) + (Math.abs(evalX - cx) * 0.025)); 
                            let primary = Math.sin((evalY * 0.018) + phase) * localTurb * (0.5 + 0.6 * envelope);
                            let secondary = Math.sin((evalY * 0.035) + (Math.abs(evalX - cx) * 0.05) + phase) * localTurb * 0.4;
                            dx = primary + secondary;
                        } else if (layout === 'muscle') {
                            dx = Math.sin((y * 0.015) + phase) * localTurb + Math.sin((y * 0.025) + (Math.abs(currentX - cx) * 0.06) + phase) * localTurb * 0.85;
                        } else {
                            dx = Math.sin((evalY * 0.012) + phase * 1.1) * localTurb * 1.2 + Math.sin((evalY * 0.033) - phase * 0.4) * (localTurb * 0.4);
                        }
                        
                        let pulseSine = (Math.sin((evalY * 0.02) + phase) + 1) / 2; 
                        points.push({ x: currentX + dx, y: y, w: Math.max(0.1, baseThick + (pulseSine * varThick)) });
                    }
                    allPaths.push(points);
                }
            }

            const angleRad = (parseInt(state.angle) || 0) * (Math.PI / 180);
            
            allPaths.forEach(path => path.forEach(pt => {
                if (angleRad !== 0) {
                    const nx = Math.cos(angleRad) * (pt.x - cx) - Math.sin(angleRad) * (pt.y - cy) + cx;
                    const ny = Math.sin(angleRad) * (pt.x - cx) + Math.cos(angleRad) * (pt.y - cy) + cy;
                    pt.x = nx; 
                    pt.y = ny;
                }
                pt.x += offsetX;
                pt.y += offsetY;
            }));
            
            const borderW = parseInt(state.patternBorder) || 12;
            const filletR = parseInt(state.lineFilletRadius) || 0;
            
            if (filletR > 0) {
                allPaths.forEach(path => {
                    path.forEach(pt => {
                        let dLeft = pt.x - borderW;
                        let dRight = (cWidth - borderW) - pt.x;
                        let dTop = pt.y - borderW;
                        let dBottom = (cHeight - borderW) - pt.y;
                        
                        let d = Math.min(dLeft, dRight, dTop, dBottom);
                        
                        if (d < filletR) {
                            let addedW = filletR;
                            if (d > 0) {
                                let inner = Math.max(0, filletR * filletR - (filletR - d) * (filletR - d));
                                addedW = filletR - Math.sqrt(inner);
                            }
                            pt.w += addedW;
                        }
                    });
                });
            }

            return allPaths;
        }

        function drawFrame(ctx, borderW, w, h, r) {
            ctx.fillRect(0, 0, w, borderW); 
            ctx.fillRect(0, h - borderW, w, borderW); 
            ctx.fillRect(0, 0, borderW, h); 
            ctx.fillRect(w - borderW, 0, borderW, h); 
            
            if (r > 0) {
                ctx.beginPath();
                ctx.moveTo(borderW, borderW);
                ctx.lineTo(borderW + r, borderW);
                ctx.arc(borderW + r, borderW + r, r, 1.5 * Math.PI, Math.PI, true);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(w - borderW, borderW);
                ctx.lineTo(w - borderW, borderW + r);
                ctx.arc(w - borderW - r, borderW + r, r, 0, 1.5 * Math.PI, true);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(borderW, h - borderW);
                ctx.lineTo(borderW, h - borderW - r);
                ctx.arc(borderW + r, h - borderW - r, r, Math.PI, 0.5 * Math.PI, true);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(w - borderW, h - borderW);
                ctx.lineTo(w - borderW - r, h - borderW);
                ctx.arc(w - borderW - r, h - borderW - r, r, 0.5 * Math.PI, 0, true);
                ctx.fill();
            }
        }

        function traceInnerRoundedRect(ctx, borderW, w, h, r) {
            let ix = borderW, iy = borderW, iw = w - 2*borderW, ih = h - 2*borderW;
            ctx.beginPath();
            if (r > 0) {
                ctx.moveTo(ix + r, iy);
                ctx.lineTo(ix + iw - r, iy);
                ctx.arc(ix + iw - r, iy + r, r, 1.5 * Math.PI, 0);
                ctx.lineTo(ix + iw, iy + ih - r);
                ctx.arc(ix + iw - r, iy + ih - r, r, 0, 0.5 * Math.PI);
                ctx.lineTo(ix + r, iy + ih);
                ctx.arc(ix + r, iy + ih - r, r, 0.5 * Math.PI, Math.PI);
                ctx.lineTo(ix, iy + r);
                ctx.arc(ix + r, iy + r, r, Math.PI, 1.5 * Math.PI);
            } else {
                ctx.rect(ix, iy, iw, ih);
            }
        }

        function renderExtrudedLayer(drawCallback, faceColor, edgeColor, startZ, thickness, w, h) {
            const faceBuffer = document.createElement('canvas');
            faceBuffer.width = w; faceBuffer.height = h;
            const faceCtx = faceBuffer.getContext('2d');
            faceCtx.fillStyle = faceColor;
            drawCallback(faceCtx);

            const edgeBuffer = document.createElement('canvas');
            edgeBuffer.width = w; edgeBuffer.height = h;
            const edgeCtx = edgeBuffer.getContext('2d');
            edgeCtx.fillStyle = edgeColor;
            drawCallback(edgeCtx);

            for (let v = 0; v < thickness; v++) {
                const isTop = (v === thickness - 1);
                const displayCanvas = document.createElement('canvas');
                displayCanvas.width = w; displayCanvas.height = h;
                displayCanvas.style.transform = `translateZ(${startZ + v}px)`;
                
                if (v === 0) {
                    displayCanvas.style.filter = 'drop-shadow(2px 8px 8px rgba(0,0,0,0.6))';
                }

                const ctx = displayCanvas.getContext('2d');
                ctx.drawImage(isTop ? faceBuffer : edgeBuffer, 0, 0);
                stage.appendChild(displayCanvas);
            }
            return startZ + thickness; 
        }

        function generateArt() {
            if (isDrawingMode) return;
            stage.innerHTML = ''; 
            const cWidth = parseInt(state.canvasWidth) || 800;
            const cHeight = parseInt(state.canvasHeight) || 800;
            
            stage.style.width = `${cWidth}px`;
            stage.style.height = `${cHeight}px`;

            const patternLayers = parseInt(state.patternLayers) || 3;
            const spacers = parseInt(state.spacers) || 1;
            const patternBorder = parseInt(state.patternBorder) || 12;
            const spacerBorder = parseInt(state.spacerBorder) || 18;
            const cornerRadius = parseInt(state.cornerRadius) || 0;
            const visualThick = parseInt(state.visualThickness) || 6;
            const totalShiftX = parseInt(state.shiftX) || 0;
            const totalShiftY = parseInt(state.shiftY) || 0;
            const edgeColor = state.color_edge;
            
            const isGrid = state.layout.startsWith('grid_');

            let currentZ = 0;

            currentZ = renderExtrudedLayer((ctx) => {
                ctx.fillRect(0, 0, cWidth, cHeight);
            }, state.color_solidBase, edgeColor, currentZ, visualThick, cWidth, cHeight);

            for (let p = 0; p < patternLayers; p++) {
                const progress = p / (Math.max(1, patternLayers - 1));
                const phaseShift = progress * (parseFloat(state.variation) / 10);
                const offsetX = progress * totalShiftX;
                const offsetY = progress * totalShiftY;
                
                let layerColor = state.color_patternMid;
                if (p === 0) layerColor = state.color_patternBottom;
                if (p === patternLayers - 1) layerColor = state.color_patternTop;

                let pPaths = null;
                let gridShapes = null;
                
                if (isGrid) {
                    gridShapes = getGridShapes(progress, phaseShift, cWidth, cHeight, offsetX, offsetY);
                } else {
                    pPaths = calculatePaths(phaseShift, cWidth, cHeight, offsetX, offsetY);
                }

                currentZ = renderExtrudedLayer((ctx) => {
                    drawFrame(ctx, patternBorder, cWidth, cHeight, cornerRadius);
                    ctx.save();
                    traceInnerRoundedRect(ctx, patternBorder, cWidth, cHeight, cornerRadius);
                    ctx.clip();
                    
                    if (isGrid) {
                        ctx.beginPath();
                        gridShapes.vPaths.forEach(path => {
                            let poly = generatePolygonFromPath(path);
                            if (poly) drawPolygon(ctx, poly);
                        });
                        gridShapes.hPaths.forEach(path => {
                            let poly = generatePolygonFromPath(path);
                            if (poly) drawPolygon(ctx, poly);
                        });
                        ctx.fill();

                        if (gridShapes.rects.length > 0) {
                            ctx.beginPath();
                            gridShapes.rects.forEach(r => ctx.rect(r.x, r.y, r.w, r.h));
                            ctx.fill();
                        }
                        
                        if (gridShapes.circles.length > 0) {
                            ctx.beginPath();
                            gridShapes.circles.forEach(c => {
                                ctx.moveTo(c.x + c.r, c.y);
                                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                            });
                            ctx.fill();
                        }
                    } else {
                        ctx.beginPath();
                        pPaths.forEach(points => {
                            let poly = generatePolygonFromPath(points);
                            if (poly) drawPolygon(ctx, poly);
                        });
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }, layerColor, edgeColor, currentZ, visualThick, cWidth, cHeight);

                if (p < patternLayers - 1) {
                    for (let s = 0; s < spacers; s++) {
                        currentZ = renderExtrudedLayer((ctx) => {
                            drawFrame(ctx, spacerBorder, cWidth, cHeight, cornerRadius);
                        }, state.color_spacerFrame, edgeColor, currentZ, visualThick, cWidth, cHeight);
                    }
                }
            }
        }

        exportBtn.addEventListener('click', () => {
            const cWidth = parseInt(state.canvasWidth) || 800;
            const cHeight = parseInt(state.canvasHeight) || 800;
            const patternLayers = parseInt(state.patternLayers) || 3;
            const spacers = parseInt(state.spacers) || 1;
            const patternBorder = parseInt(state.patternBorder) || 12;
            const spacerBorder = parseInt(state.spacerBorder) || 18;
            const cornerRadius = parseInt(state.cornerRadius) || 0;
            const totalShiftX = parseInt(state.shiftX) || 0;
            const totalShiftY = parseInt(state.shiftY) || 0;
            
            const offsetWidth = cWidth + 50;
            const hasSpacers = spacers > 0 ? 1 : 0;
            const totalWidth = offsetWidth * (1 + patternLayers + hasSpacers); 
            
            const isGrid = state.layout.startsWith('grid_');

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} ${cHeight}" width="${totalWidth}mm" height="${cHeight}mm">\n`;
            
            // Core safety fix: Enforces valid coordinates without LightBurn rejecting NaNs
            const sf = (val) => isNaN(val) ? 0 : Number(val).toFixed(2);

            // Re-written to explicitly avoid outputting nested tags on 0 radius
            const getInnerIntersectionPathD = (borderW, r) => {
                let ix = borderW, iy = borderW, iw = cWidth - 2*borderW, ih = cHeight - 2*borderW;
                if (r <= 0) {
                    return `M ${sf(ix)} ${sf(iy)} L ${sf(ix+iw)} ${sf(iy)} L ${sf(ix+iw)} ${sf(iy+ih)} L ${sf(ix)} ${sf(iy+ih)} Z`;
                } else {
                    let d = `M ${sf(ix+r)} ${sf(iy)} `;
                    d += `L ${sf(ix+iw-r)} ${sf(iy)} `;
                    d += `A ${sf(r)} ${sf(r)} 0 0 1 ${sf(ix+iw)} ${sf(iy+r)} `;
                    d += `L ${sf(ix+iw)} ${sf(iy+ih-r)} `;
                    d += `A ${sf(r)} ${sf(r)} 0 0 1 ${sf(ix+iw-r)} ${sf(iy+ih)} `;
                    d += `L ${sf(ix+r)} ${sf(iy+ih)} `;
                    d += `A ${sf(r)} ${sf(r)} 0 0 1 ${sf(ix)} ${sf(iy+ih-r)} `;
                    d += `L ${sf(ix)} ${sf(iy+r)} `;
                    d += `A ${sf(r)} ${sf(r)} 0 0 1 ${sf(ix+r)} ${sf(iy)} Z`;
                    return d;
                }
            };

            const getFrameSVG = (borderW, r) => {
                let p = `<rect x="0" y="0" width="${cWidth}" height="${borderW}" />\n`;
                p += `    <rect x="0" y="${cHeight - borderW}" width="${cWidth}" height="${borderW}" />\n`;
                p += `    <rect x="0" y="0" width="${borderW}" height="${cHeight}" />\n`;
                p += `    <rect x="${cWidth - borderW}" y="0" width="${borderW}" height="${cHeight}" />\n`;
                if (r > 0) {
                    // Removed commas to prevent regex crashing during vector processing
                    p += `    <path d="M ${borderW} ${borderW} L ${borderW+r} ${borderW} A ${r} ${r} 0 0 0 ${borderW} ${borderW+r} Z" />\n`;
                    p += `    <path d="M ${cWidth-borderW} ${borderW} L ${cWidth-borderW} ${borderW+r} A ${r} ${r} 0 0 0 ${cWidth-borderW-r} ${borderW} Z" />\n`;
                    p += `    <path d="M ${borderW} ${cHeight-borderW} L ${borderW} ${cHeight-borderW-r} A ${r} ${r} 0 0 0 ${borderW+r} ${cHeight-borderW} Z" />\n`;
                    p += `    <path d="M ${cWidth-borderW} ${cHeight-borderW} L ${cWidth-borderW-r} ${cHeight-borderW} A ${r} ${r} 0 0 0 ${cWidth-borderW} ${cHeight-borderW-r} Z" />\n`;
                }
                return p;
            };

            function getPolygonSVG(poly) {
                if (!poly || !poly.leftEdge || poly.leftEdge.length === 0) return "";
                let d = `M ${sf(poly.leftEdge[0].x)} ${sf(poly.leftEdge[0].y)} `;
                for (let i = 1; i < poly.leftEdge.length; i++) d += `L ${sf(poly.leftEdge[i].x)} ${sf(poly.leftEdge[i].y)} `;
                for (let i = poly.rightEdge.length - 1; i >= 0; i--) d += `L ${sf(poly.rightEdge[i].x)} ${sf(poly.rightEdge[i].y)} `;
                d += "Z ";
                return d;
            }

            let currentColumn = 0;

            svg += `<g id="SolidBase" fill="${state.color_solidBase}" stroke="none" transform="translate(${currentColumn * offsetWidth}, 0)">\n`;
            svg += `  <rect x="0" y="0" width="${cWidth}" height="${cHeight}" />\n`;
            svg += `</g>\n\n`;
            currentColumn++;

            for (let p = 0; p < patternLayers; p++) {
                const progress = p / (Math.max(1, patternLayers - 1));
                const phaseShift = progress * (parseFloat(state.variation) / 10);
                const offsetX = progress * totalShiftX;
                const offsetY = progress * totalShiftY;
                
                let layerColor = state.color_patternMid;
                let layerName = `Pattern_Mid_${p}`;
                if (p === 0) { layerColor = state.color_patternBottom; layerName = "Pattern_Bottom"; }
                if (p === patternLayers - 1) { layerColor = state.color_patternTop; layerName = "Pattern_Top"; }

                svg += `<g id="${layerName}" fill="${layerColor}" stroke="#000000" stroke-width="0.5" transform="translate(${currentColumn * offsetWidth}, 0)">\n`;
                svg += `  ${getFrameSVG(patternBorder, cornerRadius)}\n`;
                
                // NO <clipPath> utilized here: The geometries are allowed to overflow, ready for boolean clipping later
                svg += `  <g id="Unclipped_Generative_Shapes_${p}">\n`;
                
                if (isGrid) {
                    const gridShapes = getGridShapes(progress, phaseShift, cWidth, cHeight, offsetX, offsetY);
                    gridShapes.vPaths.forEach(path => {
                        let poly = generatePolygonFromPath(path);
                        if (poly) svg += `    <path d="${getPolygonSVG(poly)}" />\n`;
                    });
                    gridShapes.hPaths.forEach(path => {
                        let poly = generatePolygonFromPath(path);
                        if (poly) svg += `    <path d="${getPolygonSVG(poly)}" />\n`;
                    });
                    gridShapes.rects.forEach(r => svg += `    <rect x="${sf(r.x)}" y="${sf(r.y)}" width="${sf(Math.max(0.1, r.w))}" height="${sf(Math.max(0.1, r.h))}" />\n`);
                    gridShapes.circles.forEach(c => svg += `    <circle cx="${sf(c.x)}" cy="${sf(c.y)}" r="${sf(Math.max(0.1, c.r))}" />\n`);
                } else {
                    const pPaths = calculatePaths(phaseShift, cWidth, cHeight, offsetX, offsetY);
                    pPaths.forEach(pts => {
                        let poly = generatePolygonFromPath(pts);
                        if (poly) svg += `    <path d="${getPolygonSVG(poly)}" />\n`;
                    });
                }
                
                svg += `  </g>\n`;
                
                svg += `  <g id="LightBurn_Intersection_Tool_${p}">\n`;
                svg += `    <path d="${getInnerIntersectionPathD(patternBorder, cornerRadius)}" fill="none" stroke="#ff0000" stroke-width="1" />\n`;
                svg += `  </g>\n`;
                svg += `</g>\n\n`;
                
                currentColumn++;
            }

            if (hasSpacers) {
                const totalSpacersNeeded = spacers * (patternLayers - 1);
                svg += `<g id="SpacerTemplate" fill="${state.color_spacerFrame}" stroke="none" transform="translate(${currentColumn * offsetWidth}, 0)">\n`;
                svg += `  ${getFrameSVG(spacerBorder, cornerRadius)}`;
                svg += `  <text x="${cWidth/2}" y="${cHeight/2}" fill="${state.color_spacerFrame}" stroke="none" text-anchor="middle" font-family="sans-serif" font-size="20">Cut ${totalSpacersNeeded} Spacer(s)</text>\n`;
                svg += `</g>\n\n`;
            }

            svg += `</svg>`;

            const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
            const a = document.createElement('a'); a.href = url; a.download = `Parallax_v43.svg`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        });

        if (state.layout.startsWith('grid_')) {
            imagePhaseLabel.innerText = "Grid Shape Max Scale (%)";
            gridSizeVarGroup.style.display = 'block';
        }

        if (state.layout === 'drawn_flow' || state.layout === 'multi_drawn_flow') {
            drawPanel.style.display = 'block';
            imagePanel.style.display = 'none';
            enterDrawingMode();
        } else if (state.layout === 'image_moire' || state.layout.startsWith('grid_')) {
            drawPanel.style.display = 'none';
            imagePanel.style.display = 'block';
            if (state.imageDispMode === 'radial_canvas') {
                canvasCenterFalloffGroup.style.display = 'block';
                symBlendGroup.style.display = 'none';
            } else if (state.imageDispMode === 'horizontal_sym') {
                canvasCenterFalloffGroup.style.display = 'none';
                symBlendGroup.style.display = 'block';
            } else {
                canvasCenterFalloffGroup.style.display = 'none';
                symBlendGroup.style.display = 'none';
            }
            generateArt();
        } else {
            drawPanel.style.display = 'none';
            imagePanel.style.display = 'none';
            generateArt();
        }
        
    </script>
</body>
</html>
